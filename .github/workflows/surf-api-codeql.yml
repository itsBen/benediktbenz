name: Surf API CodeQL

on:
  push:
    branches:
      - main
    paths:
      - 'apps/surf-api/**'
      - '.github/workflows/surf-api-codeql.yml'
  pull_request:
    paths:
      - 'apps/surf-api/**'
      - '.github/workflows/surf-api-codeql.yml'
  schedule:
    - cron: '23 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # Python CodeQL analyzes source directly; no uv dependency install is required
          # unless code is generated during build.
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
