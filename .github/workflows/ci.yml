name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-quality:
    name: Website Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/website

      - name: Lint
        run: npm run lint
        working-directory: apps/website

      - name: Build
        run: npm run build
        working-directory: apps/website

  surf-api-quality:
    name: Surf API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (incl. test deps)
        run: uv sync --dev --frozen
        working-directory: apps/surf-api

      - name: Run tests
        run: uv run python -m pytest -q
        working-directory: apps/surf-api
      - name: Validate Python sources
        run: uv run python -m compileall .
        working-directory: apps/surf-api
