name: Deploy
description: This workflow runs the surf API to fetch the latest surf spots data, commits it to the repository, and triggers a Netlify deployment.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *' # Runs monthly on day 1 at 5:00 UTC

env:
  BRANCH_NAME: ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: surf-api-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-surf-api:
    name: Refresh Surf Spots Data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate required secrets
        env:
          GARMIN_CONNECT_EMAIL: ${{ secrets.GARMIN_CONNECT_EMAIL }}
          GARMIN_CONNECT_PASSWORD: ${{ secrets.GARMIN_CONNECT_PASSWORD }}
        run: |
          if [ -z "$GARMIN_CONNECT_EMAIL" ] || [ -z "$GARMIN_CONNECT_PASSWORD" ]; then
            echo "Missing required secrets: GARMIN_CONNECT_EMAIL and/or GARMIN_CONNECT_PASSWORD"
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --frozen
        working-directory: apps/surf-api

      - name: Run surf-api export
        env:
          GARMIN_CONNECT_EMAIL: ${{ secrets.GARMIN_CONNECT_EMAIL }}
          GARMIN_CONNECT_PASSWORD: ${{ secrets.GARMIN_CONNECT_PASSWORD }}
        run: uv run main.py
        working-directory: apps/surf-api

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add shared/data/visited_surf_spots.json

          if git diff --cached --quiet; then
            echo "No surf data changes to commit."
            exit 0
          fi

          git commit -m "chore(data): refresh visited surf spots"
          git push

  deploy-website:
    name: Deploy website on Netlify
    needs: run-surf-api
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup NodeJS
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: "npm"
        cache-dependency-path: apps/website/package-lock.json

    - name: Install Netlify CLI
      run: npm install netlify-cli@23.12.3 -g

    - name: Install Dependencies
      run: npm ci
      working-directory: apps/website

    - name: Build project
      run: npm run build
      working-directory: apps/website

    - name: Deploy to Netlify
      id: netlify_deploy
      working-directory: apps/website
      run: |
        prod_flag=""
        if [ "$BRANCH_NAME" = "main" ]; then prod_flag="--prod"; fi
        netlify deploy \
          --dir out \
          --site ${{ secrets.NETLIFY_SITE_ID }} \
          --auth ${{ secrets.NETLIFY_API_TOKEN }} \
          --filter apps/website \
          $prod_flag
